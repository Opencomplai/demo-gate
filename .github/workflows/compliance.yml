name: compliance
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # sticky comment
  security-events: write # SARIF upload

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Opencomplai/opencomplai-action@3c8f9a77e7a48d823aae37d77fccff9e26328e37 # v1.0.2
        with:
          manifest: system-manifest.json
          upload-sarif: "true"
          with-gaps: "true"
